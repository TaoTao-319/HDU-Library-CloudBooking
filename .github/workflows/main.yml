name: HDU Auto Book

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'book = 真实预约；check = 只读检查（登录+选座，不提交）'
        type: choice
        options: [book, check]
        default: book
  # 2026-10-24：云端自动（schedule）已全部关闭。GitHub 原生 cron 对本仓库
  # 长期零投递，而云端 Job 从 19:20 起等 40 分钟才开始提交，速度和确定性都不如
  # 本机 19:50 计划任务；保留云端定时只会在同一账号上叠加请求、拖慢抢座。
  # 本文件现在只保留 workflow_dispatch 作为手动兜底（mode=book/check）。

permissions:
  contents: read

concurrency:
  # 手动触发也串行化，避免同一次放号出现两个云端 Job。
  group: hdu-seat-booking
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    # 手动 dispatch 可能提前很久启动，给足等待到 20:15 的天花板。
    timeout-minutes: 75
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Read-only check
        if: github.event.inputs.mode == 'check'
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py --check --start 15 --hours 7
      - name: Book seat
        if: github.event.inputs.mode != 'check'
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py --daily
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-booking-${{ github.run_id }}
          path: |
            logs/*.log
            .local/booking-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
