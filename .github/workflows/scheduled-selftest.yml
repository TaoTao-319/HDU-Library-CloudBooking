name: Scheduled booking self-test

# Temporary proof that a GitHub-native schedule event can complete a real
# booking. It books one hour on the day named below, then reports whether the
# run was triggered by `schedule`. It disables itself on the first scheduled
# delivery so a working scheduler cannot spam the repository all night.
on:
  workflow_dispatch:
  schedule:
    # Continuous probe: fires every 10 minutes so the exact moment GitHub starts
    # delivering scheduled events for this repository is captured.
    - cron: '*/10 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: hdu-seat-selftest
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Record the trigger and stop further probes
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "第一次原生定时投递已发生：$(date -Iseconds)"
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/actions/workflows/scheduled-selftest.yml/disable"
          echo "已停用本探测 workflow，后续不再触发。"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Book 07:00-08:00 on 2026-10-22 (fourth floor)
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: >-
          python main.py --test-booking --date 2026-10-22 --start 7 --hours 1
          --region 自定义
      - name: Verify this run created the order
        run: >-
          python scripts/verify_native_booking.py --date 2026-10-22
          --start 7 --hours 1 --event schedule,workflow_dispatch
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-selftest-${{ github.run_id }}
          path: |
            logs/*.log
            .local/booking-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
