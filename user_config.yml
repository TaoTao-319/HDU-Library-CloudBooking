# 预约后天四楼 1–332 号座位中的一个，按等级优先、等级内部随机，预约日期为周一至周五时启用，周六、周日关闭。
# 周一15–22、周二16–22、周三10–22、周四15–22、周五13–22；name 均为自定义。
# 一天可约多个互不重合的时段：把那天的 开始时间/持续小时数 两行换成「时间段」列表（缩进与 name 对齐），例如：
#   时间段:
#     - 开始时间: 7
#       持续小时数: 2
#     - 开始时间: 10
#       持续小时数: 3
#     - 开始时间: 18
#       持续小时数: 2
# 时段之间不能重合（首尾相接可以）；配了 时间段 就不要再保留 开始时间/持续小时数。
# 下面座位 ID 区间均含端点；不连续的区间分行写。指定座位只需改本文件。

周一:
  启用: true
  name: 自定义
  开始时间: 15
  持续小时数: 7
周二:
  启用: true
  name: 自定义
  开始时间: 16
  持续小时数: 6
周三:
  启用: true
  name: 自定义
  开始时间: 10
  持续小时数: 12
周四:
  启用: true
  name: 自定义
  开始时间: 15
  持续小时数: 7
周五:
  启用: true
  name: 自定义
  开始时间: 13
  持续小时数: 9
周六:
  启用: false
  name: 自定义
  开始时间: 7
  持续小时数: 15
周日:
  启用: false
  name: 自定义
  开始时间: 7
  持续小时数: 15


# 后台ID = 四楼座位号 + 62564。区间含两端；程序在内存展开，不枚举332行。
# 优先级从上到下；每轮在各等级内部重新随机，绝不跨等级整体打乱。
自定义:
  房间: 四楼
  优先级:
    - 名称: 特等座
      区间: [[62581, 62622]]  # 17–58号，42个
    - 名称: 一等座
      区间: [[62871, 62896]]  # 307–332号，26个
    - 名称: 二等座
      区间: [[62565, 62580], [62623, 62870]]  # 1–16、59–306号，264个

# 最多五轮；成功或实时确认四楼无位则提前结束。每轮内可按优先级换座。
自动预约:
  运行时间: ['20:00:00', '20:00:30', '20:01:30', '20:04:00', '20:10:00']
